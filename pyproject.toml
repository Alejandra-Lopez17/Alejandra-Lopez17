[build-system]
requires = ["setuptools >= 69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csds-352-vault"
version = "0.0.1"
description = "Data Science and Machine Learning Vault"
authors = [{name = "Jala R&D", email = "RD_GenerativeAI@jalasoft.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.12"

dependencies = [
  "ipykernel==7.2.0",
  "ipympl==0.10.0",
  "matplotlib==3.10.8",
  "numpy==2.4.2",
  "pandas==3.0.1",
  "rich==14.3.3",
  "scikit-learn==1.8.0",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "seaborn==0.13.2"
]

[project.scripts]
csds-352-vault = "app.main:main"

[tool.mypy]
python_version = "3.12"
strict = true
